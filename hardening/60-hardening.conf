# Drop-in for /etc/ssh/sshd_config.d/60-hardening.conf
# Key-only SSH; no passwords, no root login.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
X11Forwarding no

# Optional: restrict SSH to a management CIDR (uncomment and set your range).
# Match Address 10.0.0.0/8
#     AllowUsers ubuntu
