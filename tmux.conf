# remote-dev tmux config — terminal-like UX over SSH.

# Mouse wheel scrolls the pane's output (enters copy-mode) instead of sending
# arrow keys / cycling shell history. This matches local-terminal scrolling.
set -g mouse on

# Generous scrollback so you can scroll far back through output.
set -g history-limit 50000

# Leaving copy-mode: wheel-down at the bottom returns to the prompt; q or Esc also exit.
# 256-color / truecolor for a correct TUI (e.g. Claude Code) rendering.
set -g default-terminal "tmux-256color"
